<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="480" fill="#ffffff"/>

  <!-- ===================== VAE ROW ===================== -->
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1a1a1a">VAE</text>
  <text x="24" y="54" font-size="12.5" fill="#666">Single forward pass · pixel-wise reconstruction loss</text>

  <!-- Input image -->
  <rect x="24" y="80" width="110" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="79" y="110" font-size="13" text-anchor="middle" fill="#1a1a1a">Input</text>
  <text x="79" y="128" font-size="13" text-anchor="middle" fill="#1a1a1a">image x</text>

  <line x1="134" y1="115" x2="180" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Encoder -->
  <rect x="184" y="75" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="254" y="108" font-size="13" text-anchor="middle" fill="#1a1a1a">Encoder</text>
  <text x="254" y="126" font-size="11.5" text-anchor="middle" fill="#555">conv stack</text>
  <text x="254" y="141" font-size="11.5" text-anchor="middle" fill="#555">→ μ, log σ²</text>

  <line x1="324" y1="115" x2="368" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Latent -->
  <ellipse cx="425" cy="115" rx="58" ry="42" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="425" y="110" font-size="13" text-anchor="middle" fill="#1a1a1a">Latent z</text>
  <text x="425" y="127" font-size="11" text-anchor="middle" fill="#555">reparam.</text>
  <text x="425" y="141" font-size="10.5" text-anchor="middle" fill="#555">trick</text>

  <line x1="483" y1="115" x2="527" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decoder -->
  <rect x="531" y="75" width="140" height="80" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="601" y="108" font-size="13" text-anchor="middle" fill="#1a1a1a">Decoder</text>
  <text x="601" y="126" font-size="11.5" text-anchor="middle" fill="#555">transposed</text>
  <text x="601" y="141" font-size="11.5" text-anchor="middle" fill="#555">conv stack</text>

  <line x1="671" y1="115" x2="715" y2="115" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output -->
  <rect x="719" y="80" width="130" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="784" y="110" font-size="13" text-anchor="middle" fill="#1a1a1a">Reconstruction</text>
  <text x="784" y="128" font-size="13" text-anchor="middle" fill="#1a1a1a">x̂</text>

  <!-- Loss annotation -->
  <line x1="784" y1="150" x2="784" y2="178" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="4,3"/>
  <line x1="79" y1="150" x2="79" y2="178" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="431" y="192" font-size="12" text-anchor="middle" fill="#9333ea">Loss = ‖x − x̂‖² (reconstruction) + KL(q(z|x) ‖ N(0, I))</text>
  <line x1="79" y1="178" x2="784" y2="178" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- ===================== DIVIDER ===================== -->
  <line x1="0" y1="230" x2="1000" y2="230" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ===================== DDPM ROW ===================== -->
  <text x="24" y="264" font-size="18" font-weight="700" fill="#1a1a1a">DDPM</text>
  <text x="24" y="284" font-size="12.5" fill="#666">Iterative reverse process · 1000 sequential U-Net passes (full sampling)</text>

  <!-- Forward process -->
  <rect x="24" y="310" width="120" height="66" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="84" y="338" font-size="13" text-anchor="middle" fill="#1a1a1a">Image x₀</text>
  <text x="84" y="356" font-size="11" text-anchor="middle" fill="#555">(training only)</text>

  <line x1="144" y1="343" x2="185" y2="343" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="165" y="333" font-size="10.5" text-anchor="middle" fill="#888">q(xₜ|x₀)</text>

  <rect x="189" y="310" width="120" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="249" y="338" font-size="13" text-anchor="middle" fill="#1a1a1a">Noisy xₜ</text>
  <text x="249" y="356" font-size="11" text-anchor="middle" fill="#555">add Gaussian noise</text>

  <line x1="309" y1="343" x2="353" y2="343" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- U-Net -->
  <rect x="357" y="300" width="170" height="86" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="442" y="328" font-size="13" text-anchor="middle" fill="#1a1a1a">U-Net εθ(xₜ, t)</text>
  <text x="442" y="346" font-size="11" text-anchor="middle" fill="#555">residual blocks +</text>
  <text x="442" y="361" font-size="11" text-anchor="middle" fill="#555">self-attn (8×8, 16×16)</text>
  <text x="442" y="376" font-size="11" text-anchor="middle" fill="#555">+ time embedding</text>

  <line x1="527" y1="343" x2="571" y2="343" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Predicted noise -->
  <rect x="575" y="310" width="120" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="635" y="338" font-size="13" text-anchor="middle" fill="#1a1a1a">Predicted</text>
  <text x="635" y="356" font-size="13" text-anchor="middle" fill="#1a1a1a">noise ε̂</text>

  <line x1="695" y1="343" x2="736" y2="343" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="716" y="333" font-size="10.5" text-anchor="middle" fill="#888">denoise</text>

  <!-- Step back -->
  <rect x="740" y="310" width="120" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="800" y="333" font-size="12.5" text-anchor="middle" fill="#1a1a1a">xₜ₋₁</text>
  <text x="800" y="351" font-size="10.5" text-anchor="middle" fill="#555">repeat t = T…1</text>
  <text x="800" y="365" font-size="10.5" text-anchor="middle" fill="#555">(or ~50 w/ DDIM)</text>

  <!-- loop arrow back to U-Net -->
  <path d="M 800 310 C 800 270, 442 270, 442 300" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <line x1="860" y1="343" x2="900" y2="343" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Final output -->
  <rect x="904" y="310" width="72" height="66" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="940" y="338" font-size="12" text-anchor="middle" fill="#1a1a1a">Image</text>
  <text x="940" y="354" font-size="12" text-anchor="middle" fill="#1a1a1a">x₀</text>

  <!-- Loss annotation -->
  <text x="442" y="415" font-size="12" text-anchor="middle" fill="#9333ea">Loss = ‖ε − εθ(xₜ, t)‖² (noise-prediction MSE, L_simple)</text>

  <!-- Legend -->
  <rect x="24" y="440" width="14" height="14" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="44" y="451" font-size="11" fill="#555">Image / data tensor</text>
  <rect x="200" y="440" width="14" height="14" fill="#ecfdf5" stroke="#059669"/>
  <text x="220" y="451" font-size="11" fill="#555">Learned network</text>
  <rect x="360" y="440" width="14" height="14" fill="#fee2e2" stroke="#dc2626"/>
  <text x="380" y="451" font-size="11" fill="#555">Noise tensor</text>
  <rect x="500" y="440" width="14" height="14" fill="#fef3c7" stroke="#d97706"/>
  <text x="520" y="451" font-size="11" fill="#555">Latent / intermediate state</text>
</svg>
